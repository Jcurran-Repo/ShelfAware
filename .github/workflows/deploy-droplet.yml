name: Deploy to the droplet

# Manual only, and deliberately so. `deploy/deploy.ps1` does this from a Windows checkout with an ssh
# key on the machine; this is the same sequence run by a CI runner instead, so a deploy doesn't need
# anyone to be at their desk. It exists because a project session CANNOT reach the droplet — it has no
# ssh client and port 22 is unreachable from it — while a GitHub runner has both.
#
# ⚠️ NO push trigger. A merge to master must not deploy anything: CLAUDE.md's gate is about what LANDS
# on master, and "landed" and "live" are separate decisions that stay separate here. It also takes a
# `ref`, so an UNMERGED branch can be put on the demo box and tried before it is merged — which is the
# order that makes sense for a demo box, and the reason the input exists.
#
# Setup, once (see docs/deploy-droplet.md § "Deploying from CI"). ⚠️ All THREE are ENVIRONMENT secrets
# of the `droplet` environment — Settings → Environments → droplet → Environment secrets — and not
# repository secrets. The difference is the whole security of this file: on a workflow_dispatch GitHub
# reads the workflow FROM THE BRANCH BEING DISPATCHED, so anyone who can push a branch can push a copy
# of this file with the `environment:` line deleted. A repository secret would still be handed to it,
# and the approval below would be advisory. An environment secret is not: delete the line and the job
# gets no key, so the gate enforces itself rather than asking nicely.
#   - secret DROPLET_SSH_KEY   a PRIVATE key whose public half is in the droplet's authorized_keys.
#                              Generate a DEDICATED one for this; don't reuse a personal key.
#   - secret DROPLET_HOST      user@host, e.g. root@203.0.113.10
#   - secret DROPLET_KNOWN_HOSTS  the output of `ssh-keyscan -H <host>`, so the runner pins the host
#                              key instead of trusting whatever answers on the night. REQUIRED: a
#                              box holding real households' receipts is not one to meet for the first
#                              time on every run.
#   - environment `droplet`, with yourself as a required reviewer so a deploy needs one click from you.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to deploy (an unmerged branch is fine)'
        required: false
        default: ''
      bootstrap:
        description: 'Also do one-time box setup: swap file + the Kokoro and Moonshine models'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One deploy at a time. cancel-in-progress is false: a half-finished install.sh is a box with a
# staging directory and no service, so an in-flight deploy finishes rather than being abandoned.
concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish, ship, install
    runs-on: ubuntu-latest
    # ⚠️ Do NOT delete this line. It is not only the approval gate: the three secrets below belong to
    # this environment, so without it the job cannot reach the box at all. That is deliberate — it is
    # what stops "nothing reaches production without a human" from being a line in a file that the next
    # branch can delete. Everything up to the button is automated; the button is a person.
    environment: droplet

    steps:
      - uses: actions/checkout@v7
        with:
          # Empty means the ref this workflow was dispatched on, which is what the dispatcher chose.
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # The repo's global.json, never a wildcard — the same rule ci.yml states and for the same
          # reason: a deploy built on a toolchain nobody develops with proves nothing about the code.
          global-json-file: global.json

      # Build before touching the box. A publish that fails here costs nothing; one that fails after
      # the service is stopped costs an outage.
      - name: Publish (self-contained linux-x64)
        run: |
          dotnet publish src/ShelfAware.Web -c Release -r linux-x64 --self-contained \
            -o publish/linux-x64
          test -f publish/linux-x64/ShelfAware.Web \
            || { echo "::error::Publish output has no apphost — wrong runtime identifier?"; exit 1; }

      - name: Pack
        run: tar -czf shelfaware.tar.gz -C publish/linux-x64 .

      - name: Set up the ssh key
        env:
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          test -n "$KEY"  || { echo "::error::Secret DROPLET_SSH_KEY is not set — see this file's header."; exit 1; }
          test -n "$HOST" || { echo "::error::Secret DROPLET_HOST is not set — see this file's header."; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "::error::Secret DROPLET_KNOWN_HOSTS is not set. Run \
            'ssh-keyscan -H <host>' and store the output — see this file's header."; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned, never trust-on-first-use. An impostor host can't take the key — ssh signs a
          # session-bound challenge rather than sending it — but it CAN take the build, answer /healthz
          # with a 200 and let this job go green while the real box runs yesterday's code. A deploy that
          # reports success against the wrong machine is worse than one that fails.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # One-time box setup, idempotent, so re-running it is safe and so a rebuilt droplet is one
      # dispatch away rather than an afternoon with a runbook.
      - name: Bootstrap the box (swap + voice models)
        if: inputs.bootstrap
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$HOST" 'bash -euo pipefail -s' <<'REMOTE'
          # Swap: a 2 GB box running a voice model wants the cushion. Skip if any swap exists.
          if [ "$(swapon --show --noheadings | wc -l)" -eq 0 ]; then
            fallocate -l 2G /swapfile && chmod 600 /swapfile
            mkswap /swapfile && swapon /swapfile
            grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
            echo "Added a 2 GB swap file."
          else
            echo "Swap already present; left alone."
          fi

          # The model archives are .tar.bz2 and GNU tar shells out to bzip2 to read them, which a
          # minimal Ubuntu image does not ship — the first run of this found that out by getting a
          # verified archive onto the box and then failing to open it.
          if ! command -v bzip2 >/dev/null 2>&1; then
            echo "Installing bzip2, which the model archives need..."
            DEBIAN_FRONTEND=noninteractive apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bzip2
          fi

          mkdir -p /var/lib/shelfaware/models
          cd /var/lib/shelfaware/models

          # The mouth (docs/deploy-kokoro.md) and the ear (docs/deploy-moonshine.md). Each unpacks only
          # if it isn't already there, so this step is safe to re-run and costs nothing when it is.
          #
          # ⚠️ CHECKSUMMED, and it matters more here than in most places: these are release ASSETS on a
          # mutable tag, fetched as root and unpacked onto a box holding real households' data. Nobody
          # is accusing upstream of anything — the point is that "the bytes we measured" and "whatever
          # that URL serves today" are different promises, and only the first one is worth running as
          # root. Measured 2026-09-21; if a re-run fails here, look at what changed before you edit
          # the hash. --no-same-owner/--no-same-permissions so an archive cannot choose its own
          # ownership or set a setuid bit on the way in.
          fetch() {
            local dir="$1" sha="$2" url="$3"
            if [ -d "$dir" ]; then echo "$dir already unpacked."; return; fi
            echo "Fetching $dir..."
            curl -fsSL -o model.tar.bz2 "$url"
            echo "$sha  model.tar.bz2" | sha256sum -c - \
              || { echo "::error::$dir did not match its recorded sha256; not unpacking it."; rm -f model.tar.bz2; exit 1; }
            # ⚠️ Unpacked into a staging directory and moved into place only once it is whole. The
            # guard above is "is the directory there", so a half-extracted one — a disk that filled,
            # a connection that dropped — would read as unpacked forever, and the app would refuse to
            # boot naming files that were never going to arrive.
            rm -rf .staging && mkdir .staging
            tar xjf model.tar.bz2 -C .staging --no-same-owner --no-same-permissions
            mv ".staging/$dir" "$dir"
            rm -rf .staging model.tar.bz2
          }
          fetch kokoro-int8-en-v0_19 \
            c9f0dd393615805b0bab050c340834d5e684e732aec91c0e860cd30e982c08bd \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-en-v0_19.tar.bz2
          fetch sherpa-onnx-moonshine-tiny-en-int8 \
            d5fe6ec4334fef36255b2a4010412cad4c007e33103fec62fb5d17cad88086f2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-moonshine-tiny-en-int8.tar.bz2
          # The fast mouth. Kokoro is warmer and this box cannot afford it: measured at 3.1x real time
          # here against Piper's 0.05x on hardware with the int8 instructions Kokoro's quantization
          # wants. Both are unpacked, so Speech:Provider can be moved either way without a deploy.
          #
          # Ryan-medium is this box's voice, picked by ear in the bake-off (docs/voice-bakeoff.md) and
          # measured HERE at 0.12-0.14x once loaded. ⚠️ Medium, not high: Ryan-high measured 0.8-0.95x
          # on this box -- five times the cost, right at the 1.0x line, on two cores the website shares.
          # Lessac stays unpacked because it was the voice before, so going back is the one env line
          # that names the directory -- the weights' name is read off it (PiperSpeechOptions).
          fetch vits-piper-en_US-ryan-medium \
            c546af78b6395b4e7c4ce1ed899438b64426a362f5d4ec5fecd090ded9ad7505 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-ryan-medium.tar.bz2
          fetch vits-piper-en_US-lessac-medium \
            9e3febfacf0abf4270172d2958bcec246032b7e88efc2720840cc80c93de334e \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-lessac-medium.tar.bz2

          # Root-owned and world-readable, which is install.sh's posture for the app itself and for its
          # reason: the service account reads its model, it does not get to rewrite it. A compromised app
          # process should not be able to leave something behind in a directory it loads from.
          chown -R root:root /var/lib/shelfaware/models
          chmod -R a+rX /var/lib/shelfaware/models
          df -h / | tail -1
          REMOTE

      - name: Ship it
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          scp -i ~/.ssh/id_deploy -o BatchMode=yes shelfaware.tar.gz "$HOST:/tmp/shelfaware.tar.gz"
          scp -i ~/.ssh/id_deploy -o BatchMode=yes deploy/install.sh "$HOST:/tmp/shelfaware-install.sh"

      # install.sh stages outside the live directory, swaps, keeps the previous build at
      # /opt/shelfaware.prev, and fails loudly if the service doesn't come back up. Its exit code is
      # this job's result — a deploy that didn't start the app is a red run, not a green one.
      - name: Install
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
        run: ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$HOST" 'bash /tmp/shelfaware-install.sh'

      # Asked of the app itself, over the loopback, so a green here means the APP answered — not that
      # a proxy in front of it served a cached page or an error skin.
      - name: Health check
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$HOST" \
            'curl -fsS --max-time 20 http://127.0.0.1:5000/healthz' \
            || { echo "::error::/healthz did not answer. The build is live but unhealthy; \
                 /opt/shelfaware.prev is the previous one."; exit 1; }

      # ⚠️ `systemctl is-active` and nothing more. This repo is PUBLIC, so an Actions log is world
      # readable, and a journal tail from a box carrying real households' data is not a thing to publish
      # — on a failed deploy it is startup exception text, which in this codebase quotes configuration
      # paths and setting keys. The journal is one ssh away for the person who can already read it.
      - name: Say what is running
        if: always()
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$HOST" 'systemctl is-active shelfaware' || true

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
