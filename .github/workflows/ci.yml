name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # One declared toolchain: the repo's global.json, never a wildcard here. A workflow that
          # names its own version drifts from what developers build with, and a green run then
          # says nothing about whether the repo compiles anywhere else.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ShelfAware.slnx

      - name: Build
        # pipefail, or `tee` swallows a failed build and the job goes green on a broken tree.
        run: |
          set -o pipefail
          dotnet build ShelfAware.slnx --configuration Release --no-restore | tee build.log
          # MSBuild's OWN summary count, not a grep for the word "warning" -- which also matches
          # warning TEXT and every line that mentions one, and would over-report wildly. A fresh
          # checkout means this is a non-incremental build, so the count is real: an incremental
          # one does not re-emit warnings for up-to-date targets and reports zero regardless.
          # `|| true` because grep exits 1 when it matches nothing, and under `set -e` an assignment
          # from a failed substitution aborts the step — so an MSBuild summary this pattern didn't
          # recognise would fail the BUILD over a number the card merely displays. No count means the
          # card omits the tile, which is the honest degradation.
          warnings=$(grep -oP '^\s+\K\d+(?= Warning\(s\))' build.log | tail -1 || true)
          echo "BUILD_WARNINGS=${warnings:-}" >> "$GITHUB_ENV"

      # Both unit-test projects run in CI: the pure engine tests, and the AI-layer
      # tests that drive the tool loop / extractor retry through a faked IChatClient
      # (no key). Only the extraction eval harness (tests/ShelfAware.Evals) needs a
      # live API key and is run manually.
      #
      # Each emits a .trx into TestResults; the "Test status snapshot" step below folds
      # those into test-status.json (the admin dashboard's Tests & quality card). The
      # LogFileName is the friendly project label the card shows.
      - name: Test — engine
        run: dotnet test tests/ShelfAware.Tests/ShelfAware.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=Engine.trx" --results-directory TestResults

      - name: Test — AI layer (faked client)
        run: dotnet test tests/ShelfAware.Llm.Tests/ShelfAware.Llm.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=AI.trx" --results-directory TestResults

      - name: Test — persistence (in-memory SQLite)
        run: dotnet test tests/ShelfAware.Web.Tests/ShelfAware.Web.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=Persistence.trx" --results-directory TestResults

      - name: Test — page components (bUnit)
        run: dotnet test tests/ShelfAware.Web.UI.Tests/ShelfAware.Web.UI.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=Pages.trx" --results-directory TestResults

      # Fold the .trx files into the snapshot the admin dashboard reads, and publish it as an artifact.
      # always() so a run that had a failing test still produces a (partial) snapshot — a card that goes
      # blank the moment something breaks is a card nobody can use to find out what broke.
      #
      # The publish-test-status job below commits it back to master. It is a SEPARATE job so this one keeps
      # a read-only token: permissions are per-job, and a job that runs for pull_request must not hold a
      # write token just because the push path needs one.
      - name: Test status snapshot
        if: always()
        run: dotnet run --project tools/TestStatusGen --configuration Release --no-build -- TestResults artifacts/test-status.json

      - name: Upload test status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-status
          path: artifacts/test-status.json
          if-no-files-found: warn

  # ⚠️ Any artifact that makes a factual claim about this codebase must be produced by the thing it claims
  # about. test-status.json was refreshed by a human remembering to, and nobody did: the admin card read
  # 2568 tests against an actual 3185, from a three-week-old file stamped with a long-merged branch. The
  # card was rendering its input faithfully; the input was a number somebody typed. eval-results.json has
  # always worked this way and has always been right.
  #
  # A GITHUB_TOKEN push does not trigger workflows, so this cannot loop.
  publish-test-status:
    name: Publish test status
    needs: build-test
    # Push to master only. A pull_request run — especially from a fork — has nowhere to commit this, and
    # committing a PR's numbers to master would make the card describe code that is not on master.
    # always(), so a run with a FAILING test still publishes: "3 failing" is exactly the state the card
    # exists to show, and a card that only ever publishes green is one that can never deliver bad news.
    # needs.build-test.result is deliberately not checked; the guard that matters is the empty-snapshot
    # refusal in the commit step, which is what separates "tests failed" from "nothing ran".
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialised, so two pushes landing together cannot race each other's commit. cancel-in-progress is
    # false: the later run's numbers are the ones we want, but the earlier run's commit must finish first
    # rather than be abandoned mid-push.
    concurrency:
      group: publish-test-status
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: actions/download-artifact@v7
        with:
          name: test-status
          path: artifacts

      - name: Commit the snapshot if it changed
        run: |
          set -euo pipefail
          target=src/ShelfAware.Web/wwwroot/test-status.json

          # ⚠️ A snapshot that measured nothing is not a measurement. This job runs even when build-test
          # failed, which is right for a FAILING TEST (the card should say "3 failing" — that is the news)
          # and wrong for a failing BUILD, where no .trx exists, the generator honestly reports zero
          # projects, and committing it would make the card claim the suite is empty. Refusing an empty
          # snapshot is the one line that tells those two apart.
          if [ "$(jq '.Projects | length' artifacts/test-status.json)" -eq 0 ]; then
            echo "::warning::The snapshot has no test projects (the build probably failed) — not committing it."
            exit 0
          fi

          cp artifacts/test-status.json "$target"

          # Only when it actually changed, or master collects a no-op commit per push. GeneratedAt moves
          # every run, so this compares the numbers rather than the file: jq drops the timestamp from both
          # sides. (The commit still carries the fresh timestamp — it is the file's own provenance.)
          if git diff --quiet -- "$target"; then
            echo "Test status unchanged."
            exit 0
          fi
          if [ "$(git show HEAD:"$target" | jq -S 'del(.GeneratedAt)')" = "$(jq -S 'del(.GeneratedAt)' "$target")" ]; then
            echo "Only the timestamp moved — nothing to commit."
            git checkout -- "$target"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit \
            -m "ci: refresh the test-status snapshot" \
            -m "Written by the run that measured it, not by hand. See .github/workflows/ci.yml."

          # One rebase retry: another push can land between this job's checkout and its push, and a stale
          # snapshot for one cycle is not worth failing a build over — the next push regenerates it. A
          # failure here is a warning annotation, not a red master, because a red badge for a docs file is
          # how people learn to stop reading the badge.
          # `|| true` on the rebase: under `set -e` a bare failing command aborts the step, so without it
          # the retry path can never reach its warning and the job goes RED — which is the opposite of what
          # the paragraph above says this does. (Found by rehearsing the step, not by reading it.)
          if ! git push; then
            git pull --rebase --autostash || true
            git push || echo "::warning::Could not push the test-status snapshot; the next push to master will refresh it."
          fi
