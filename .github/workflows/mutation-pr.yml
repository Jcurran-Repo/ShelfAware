name: Mutation (PR)

# Diff-scoped mutation-testing gate, on every PR to master. Where the weekly full-Core run
# (mutation.yml) re-tests all ~2600 ShelfAware.Core mutants, this one mutates ONLY the Core files
# the PR changed (Stryker's --since diff mode) at the same 100% break threshold — so it is
# seconds-to-minutes, not the ~13-minute full run, and it catches a coverage regression BEFORE the
# merge instead of days later on the next Monday (see .claude/commands/pre-push.md step 3).
#
# It runs on every PR (no path filter) so it can be a clean required status check with no
# skipped-required-check deadlock; the "Did this PR touch Core?" step below makes it a fast no-op
# when nothing under src/ShelfAware.Core touched, so a Web/UI-only PR pays only a checkout.
#
# The full weekly run stays the backstop for the one thing diff mode can't see: a Core edit that
# makes a DIFFERENT, unchanged file's previously-killed mutant survive.
on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  mutation-diff:
    name: Core mutation (changed files)
    runs-on: ubuntu-latest
    # Usually seconds-to-minutes: --since mutates only the Core files this PR changed. But Stryker
    # re-tests the FULL Core mutant set whenever a non-C# file in the test project changes — a
    # .csproj edit (e.g. a new PackageReference) can change how every test runs, so diff-scoping is
    # no longer safe. That fallback is the same work the weekly full-Core gate does, so it gets the
    # weekly gate's 90-minute headroom (mutation.yml); 30 minutes was not enough for it and the job
    # was cancelled mid-run. The ceiling only bites that fallback — the common diff-scoped run still
    # finishes in minutes far below it.
    timeout-minutes: 90
    env:
      # The PR base commit, a GitHub-computed 40-hex SHA (never attacker-controllable). Declared here
      # rather than interpolated into a run: block — GitHub's script-injection hardening idiom — and so
      # the guard and the Stryker step share one value.
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      # fetch-depth: 0 so Stryker's --since can diff the whole history back to the PR base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Skip the expensive path entirely when the PR changes no Core source or Core tests — there is
      # nothing to mutate, and the job still reports green so a required check never blocks on it.
      - name: Did this PR touch Core?
        id: scope
        run: |
          # Capture the diff on its own line and FAIL LOUD if it errors: a silent core=false would let a
          # Core-changing PR bypass the gate. fetch-depth: 0 makes an error reachable only on real breakage.
          # THE one list of what this PR changed in Core — written to a file so the reach guard below judges
          # exactly the set this step decided on, rather than re-asking git with its own pathspec.
          changes="$RUNNER_TEMP/core-changes.txt"
          if ! git -c core.quotePath=false diff --name-only "$BASE_SHA" HEAD -- src/ShelfAware.Core/ tests/ShelfAware.Tests/ > "$changes"; then
            echo "::error::Could not diff against base $BASE_SHA — refusing to skip the mutation gate."
            exit 1
          fi
          echo "changes=$changes" >> "$GITHUB_OUTPUT"
          if [ -s "$changes" ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ShelfAware.Core or Core-test changes in this PR — mutation testing skipped."
          fi

      - name: Set up .NET
        if: steps.scope.outputs.core == 'true'
        uses: actions/setup-dotnet@v6
        with:
          # One declared toolchain: the repo's global.json, never a wildcard here. A workflow that
          # names its own version drifts from what developers build with, and a green run then
          # says nothing about whether the repo compiles anywhere else.
          global-json-file: global.json

      - name: Restore
        if: steps.scope.outputs.core == 'true'
        run: dotnet restore ShelfAware.slnx

      - name: Restore local tools (Stryker)
        if: steps.scope.outputs.core == 'true'
        run: dotnet tool restore

      # --since:<base sha> mutates only the files this PR changed vs master (and any whose covering
      # tests changed). A survivor drops the score below the 100% break threshold and fails the job.
      # Run from the test project so Stryker finds its stryker-config.json.
      - name: Mutation test — changed Core files only
        id: mutation
        if: steps.scope.outputs.core == 'true'
        working-directory: tests/ShelfAware.Tests
        run: dotnet stryker --since:"$BASE_SHA"

      # ⚠️ Reach guard. Stryker exits 0 — and this check went GREEN — on a PR whose only Core file had every
      # one of its mutants fail to compile: it logged "0 total mutants will be tested" and "unable to
      # calculate a mutation score", wrote a report with nothing testable in it, and reported no failure,
      # because a score over zero mutants is undefined rather than low. Found 2026-09-19 on WaveAudio.cs
      # (34 mutants, 34 CompileError, check green — docs/backlog.md). A gate that said yes to a file it had
      # not read is the hole; this is the floor under it. CompileError and Ignored are the two statuses
      # that mean "could not be tested"; every other status means a test was run against the mutant.
      # Runs only when the Stryker step succeeded (the implicit success() of a plain `if:`), which is
      # exactly the case the hole lives in — a red Stryker step already has the job.
      - name: Refuse a green run that tested nothing
        if: steps.scope.outputs.core == 'true'
        env:
          CHANGES: ${{ steps.scope.outputs.changes }}
        run: |
          report="$(find tests/ShelfAware.Tests/StrykerOutput -path '*/reports/mutation-report.json' 2>/dev/null | sort | tail -1)"
          if [ -z "$report" ] || [ ! -f "$report" ]; then
            echo "::error::Stryker exited 0 but wrote no JSON report, so this gate cannot say what it tested. Refusing to pass a Core change on nothing — see docs/mutation-testing.md § 'Known limitation'."
            exit 1
          fi
          total=$(jq '[.files[]?.mutants[]?] | length' "$report")
          tested=$(jq '[.files[]?.mutants[]? | select(.status != "CompileError" and .status != "Ignored")] | length' "$report")
          echo "Mutants in the report: $total; testable (a status other than CompileError/Ignored): $tested"
          if [ "$tested" -eq 0 ]; then
            # Zero testable means one of two things, and only one is the hole. A diff-scoped report keeps the
            # baseline's compile errors Core-wide (~590, in files nobody touched): --since Ignores out-of-diff
            # mutants but leaves those as CompileError. So "every mutant was CompileError or Ignored" is ALSO
            # what a PR looks like whose Core change produces no mutants at all — a new enum member, an
            # interface signature (#91 and #93, both held red on nothing).
            # So the run passes on exactly one proof: EVERY path the scope step listed is a Core .cs file the
            # report holds exactly once, with ZERO mutants of any status — nothing to test, nothing that
            # failed to compile (WaveAudio.cs), nothing Ignored by a disable comment or a missed diff. Every
            # other change fails as before: a Core test (something should have re-run), a .csproj or other
            # non-C# file, a deleted file, or a name we can't match to one report entry — unproven is not read.
            # If a PR genuinely trips this with nothing to test, say so on the PR so a reviewer can agree.
            unproven="$(jq -R -s -r --slurpfile report "$report" '
              ($report[0].files) as $files | [$files | keys[]] as $keys
              | split("\n") | map(select(length > 0)) as $changed
              | if ($changed | length) == 0 then "(no changed paths were recorded)" else
                  $changed[] | . as $c
                  | if (startswith("src/ShelfAware.Core/") and endswith(".cs") | not) then "\($c): not a Core source file"
                    else [$keys[] | select(endswith("/" + $c))] as $m
                    | if ($m | length) != 1 then "\($c): not in the report exactly once"
                      elif ($files[$m[0]].mutants | length) > 0 then "\($c): \($files[$m[0]].mutants | length) mutants, none tested"
                      else empty end
                    end
                end' "$CHANGES")"
            if [ -n "$unproven" ]; then
              echo "::error::ZERO testable mutants, and these changes were not proven to have nothing to mutate: $(printf '%s' "$unproven" | tr '\n' ';') — so the 100% this check would otherwise report is a score over nothing (Stryker logs 'unable to calculate a mutation score' for this and still exits 0). Make the mutants compile — a constant-folded argument that Stryker rewrites into a ternary is the known cause (docs/mutation-testing.md § 'Known limitation') — or, if the change genuinely has nothing to mutate, say so on the PR so a reviewer can agree."
              exit 1
            fi
            echo "::notice::This PR's Core changes produce no mutants — every changed file is in the report with zero mutants: $(tr '\n' ' ' < "$CHANGES")"
          fi

      # On a survivor, turn Stryker's "exit code 2" into an instant, clear answer ON the PR: an inline
      # annotation on each surviving line (red in the "Files changed" diff) + a plain-English job summary
      # naming the fix. Runs only when the mutation step actually failed; best-effort, never rescues the
      # red (the job stays failed).
      - name: Explain a mutation failure
        if: always() && steps.mutation.outcome == 'failure'
        run: bash .github/scripts/mutation-annotations.sh

      # The report names every surviving mutant with its file + line — keep it (pass or fail) to
      # diagnose a red run.
      - name: Upload mutation report
        if: always() && steps.scope.outputs.core == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-pr
          path: tests/ShelfAware.Tests/StrykerOutput/**/reports/
          if-no-files-found: ignore
